apply plugin: 'com.android.library'

android {
    namespace 'com.coinmerge.recovery.haptics'
    compileSdkVersion 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 34
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }
}
